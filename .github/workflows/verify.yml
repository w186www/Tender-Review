name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development environment
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify contracts, lint, types, and regression tests
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-test-results
          path: .verification/pytest-result.xml
          if-no-files-found: warn

