name: verify

on:
  pull_request:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select fail-closed verification scope
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/verification_impact.py --event "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME"
  quick:
    needs: impact
    if: needs.impact.outputs.mode == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Repository, contract and secret checks for documentation only
        shell: pwsh
        run: ./scripts/verify.ps1 -Mode Quick
  ingestion:
    needs: impact
    if: needs.impact.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Build parser and prepare real verification services
        run: |
          docker build -f Dockerfile.parser -t bidding-parser:task0005 .
          docker build -f Dockerfile.minio-verification -t tender-minio-verification:task5 .
          docker pull clamav/clamav:stable
          echo "PARSER_VERIFY_IMAGE=$(docker image inspect bidding-parser:task0005 --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "MINIO_VERIFY_IMAGE=$(docker image inspect tender-minio-verification:task5 --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Verify actual parser isolation
        run: python scripts/check_parser_sandbox.py
      - name: Verify real S3, ClamAV, OCR, worker and HTTP lifecycle
        run: python scripts/check_ingestion_containers.py
      - name: Keep ingestion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-evidence
          path: .verification/ingestion-*/server.log
          if-no-files-found: warn
          include-hidden-files: true
  postgres:
    needs: impact
    if: needs.impact.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: task0004_verification
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify actual PostgreSQL security and migration
        env:
          POSTGRES_VERIFY_URL: postgresql+psycopg://postgres:${{ github.run_id }}@localhost:5432/task0004_verification
        run: python scripts/check_postgres.py
  baseline:
    needs: impact
    if: needs.impact.outputs.mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development environment
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify contracts, lint, types, and regression tests
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-test-results
          path: .verification/pytest-result.xml
          if-no-files-found: warn

  verify-required:
    needs: [impact, quick, baseline, postgres, ingestion]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable verification job to succeed
        env:
          IMPACT: ${{ needs.impact.result }}
          MODE: ${{ needs.impact.outputs.mode }}
          QUICK: ${{ needs.quick.result }}
          BASELINE: ${{ needs.baseline.result }}
          POSTGRES: ${{ needs.postgres.result }}
          INGESTION: ${{ needs.ingestion.result }}
        run: |
          set -eu
          test "$IMPACT" = success
          case "$MODE" in
            quick) test "$QUICK" = success ;;
            full) test "$BASELINE" = success && test "$POSTGRES" = success && test "$INGESTION" = success ;;
            *) echo "Unknown verification scope"; exit 1 ;;
          esac

