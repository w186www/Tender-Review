      additionalProperties: false
      required: [execution_mode, provider, model, response_received, model_calls, input_tokens, output_tokens, estimated_cost_cny, skill_candidate_count, model_candidate_count, embedding_model, vector_index_build_id]
      properties:
        execution_mode: {type: string, enum: [real-qwen, offline-deterministic, unknown]}
        provider: {type: [string, 'null']}
        model: {type: [string, 'null']}
        response_received: {type: boolean}
        model_calls: {type: integer, minimum: 0}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        estimated_cost_cny: {type: number, minimum: 0}
        skill_candidate_count: {type: integer, minimum: 0}
        model_candidate_count: {type: integer, minimum: 0}
        embedding_model: {type: [string, 'null']}
        vector_index_build_id: {type: [string, 'null']}
    ReviewTask:
      type: object
      additionalProperties: false
      required:
      - review_task_id
      - project_id
      - run_id
      - status
      - snapshot_hash
      - retry_count
      - failure_code
      - result_id
      - created_at
      properties:
        review_task_id:
          type: string
        project_id:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_human
          - result_published
          - failed
          - cancelled
        snapshot_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        retry_count: {type: integer, minimum: 0, maximum: 2}
        failure_code: {type: [string, 'null']}
        result_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        model_runtime:
          anyOf:
            - {$ref: '#/components/schemas/ModelRuntime'}
            - {type: 'null'}
    ReviewList:
      type: object
      additionalProperties: false
      required: [items, offset, limit, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReviewTask'}}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    PendingReview:
      type: object
      additionalProperties: false
      required: [review_task_id, run_id, project_id, snapshot_hash, status, created_at]
      properties:
        review_task_id: {type: string}
        run_id: {type: string, format: uuid}
        project_id: {type: string}
        snapshot_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {type: string, const: waiting_human}
        created_at: {type: string, format: date-time}
    PendingReviewList:
      type: object
      additionalProperties: false
      required: [items, offset, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PendingReview'}}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
    ReportList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReportMetadata'}}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [event_id, actor_id, action, resource_id, request_id, occurred_at]
      properties:
        event_id: {type: string}
        actor_id: {type: [string, 'null']}
        action: {type: string}
        resource_id: {type: [string, 'null']}
        request_id: {type: string}
        occurred_at: {type: string, format: date-time}
    AuditEventList:
      type: object
      additionalProperties: false
      required: [items, offset, limit, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    ErrorCode:
      type: string
      enum:
      - INVALID_REQUEST
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - VALIDATION_ERROR
      - RATE_LIMITED
      - INTERNAL_ERROR
      - HTTP_ERROR
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
    Role:
      type: string
      enum:
      - admin
      - reviewer
      - auditor
      - operator
    Login:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      required:
      - tenant_id
      - username
      - password
    AccessToken:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          minimum: 60
          maximum: 3600
      required:
      - access_token
      - token_type
      - expires_in
    Identity:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
      - tenant_id
      - user_id
      - username
      - role
    ProjectUpdate:
      allOf:
      - $ref: '#/components/schemas/ProjectFields'
      - type: object
        required:
        - expected_version
        properties:
          expected_version:
            type: integer
            minimum: 1
      unevaluatedProperties: false
    ProjectList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - items
      - offset
      - limit
    ProjectHistory:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      required:
      - items
    Logout:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - revoked
      required:
      - status
    Fragment:
      additionalProperties: false
      allOf:
      - else:
          properties:
            page:
              minimum: 1
              type: integer
            bbox:
              items:
                minimum: 0
                type: number
              maxItems: 4
              minItems: 4
              type: array
          required:
          - page
          - bbox
        if:
          properties:
            coordinate_system:
              const: ooxml
          required:
          - coordinate_system
        then:
          properties:
            page:
              type: 'null'
            bbox:
              type: 'null'
      - if:
          properties:
            kind:
              const: table_cell
          required:
          - kind
        then:
          properties:
            table:
              minimum: 0
              type: integer
            row:
              minimum: 0
              type: integer
            column:
              minimum: 0
              type: integer
          required:
          - table
          - row
          - column
      properties:
        locator:
          maxLength: 500
          minLength: 1
          title: Locator
          type: string
        page:
          anyOf:
          - maximum: 300
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Page
        bbox:
          anyOf:
          - items:
              type: number
            maxItems: 4
            minItems: 4
            type: array
          - type: 'null'
          default: null
          title: Bbox
        coordinate_system:
          enum:
          - pdf_points
          - image_pixels
          - ooxml
          title: Coordinate System
          type: string
        kind:
          enum:
          - paragraph
          - table_cell
          - ocr
          title: Kind
          type: string
        section:
          default: ''
          maxLength: 300
          title: Section
          type: string
        text:
          maxLength: 8000
          title: Text
          type: string
        text_sha256:
          pattern: ^[a-f0-9]{64}$
          title: Text Sha256
          type: string
        source:
          enum:
          - native
          - ocr
          - manual
          title: Source
          type: string
        confidence:
          anyOf:
          - maximum: 1
            minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Confidence
        table:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Table
        row:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Row
        column:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Column
      required:
      - locator
      - coordinate_system
      - kind
      - text
      - text_sha256
      - source
      title: Fragment
      type: object
    SectionResponse:
      additionalProperties: false
      properties:
        section_id:
          title: Section Id
          type: string
        source_hash:
          pattern: ^[a-f0-9]{64}$
          title: Source Hash
          type: string
        automatic:
          $ref: '#/components/schemas/Fragment'
        effective:
          $ref: '#/components/schemas/Fragment'
        revision:
          minimum: 1
          title: Revision
          type: integer
      required:
      - section_id
      - source_hash
      - automatic
      - effective
      - revision
      title: SectionResponse
      type: object
    DocumentSections:
      additionalProperties: false
      properties:
        document_id:
          title: Document Id
          type: string
        parse_version:
          minimum: 1
          title: Parse Version
          type: integer
        items:
          items:
            $ref: '#/components/schemas/SectionResponse'
          title: Items
          type: array
      required:
      - document_id
      - parse_version
      - items
      title: SectionsResponse
      type: object
    ContextCandidate:
      additionalProperties: false
      properties:
        field:
          enum:
          - procurement_type
          - project_type
          - region
          - name
          - industry
          - budget_amount
          - applicable_system
          title: Field
          type: string
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        confidence:
          maximum: 1
          minimum: 0
          title: Confidence
          type: number
        section_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Section Id
      required:
      - field
      - value
      - confidence
      title: ContextCandidate
      type: object
    DocumentContext:
      additionalProperties: false
      properties:
        document_id:
          title: Document Id
          type: string
        version:
          minimum: 1
          title: Version
          type: integer
        candidates:
          items:
            $ref: '#/components/schemas/ContextCandidate'
          title: Candidates
          type: array
        manual:
          anyOf:
          - $ref: '#/components/schemas/ContextFields'
          - type: 'null'
          default: null
        confirmed:
          title: Confirmed
          type: boolean
        reason:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Reason
      required:
      - document_id
      - version
      - candidates
      - confirmed
      title: DocumentContext
      type: object
    ContextFields:
      additionalProperties: false
      properties:
        name:
          maxLength: 300
          minLength: 1
          title: Name
          type: string
        procurement_type:
          enum:
          - government
          - enterprise
          - other
          title: Procurement Type
          type: string
        project_type:
          enum:
          - works
          - goods
          - services
          title: Project Type
          type: string
        region:
          maxLength: 200
          minLength: 1
          title: Region
          type: string
        industry:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Industry
        budget_amount:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Budget Amount
        applicable_system:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          default: null
          title: Applicable System
        procurement_method: *id001
        buyer_type: *id002
        subject_type: *id003
        legal_frameworks: *id004
      required:
      - name
      - procurement_type
      - project_type
      - region
      title: ContextFields
      type: object
    ContextConfirmation:
      additionalProperties: false
      properties:
        expected_version:
          minimum: 1
          title: Expected Version
          type: integer
        reason:
          maxLength: 1000
          minLength: 1
          title: Reason
          type: string
        context:
          $ref: '#/components/schemas/ContextFields'
      required:
      - expected_version
      - reason
      - context
      title: ContextConfirmation
      type: object
    TextCorrection:
      additionalProperties: false
      properties:
        section_id:
          title: Section Id
          type: string
        text:
          maxLength: 8000
          minLength: 1
          title: Text
          type: string
      required:
      - section_id
      - text
      title: TextCorrection
      type: object
    QualityCorrection:
      additionalProperties: false
      properties:
        expected_parse_version:
          minimum: 1
          title: Expected Parse Version
          type: integer
        reason:
          maxLength: 1000
          minLength: 1
          title: Reason
          type: string
        corrections:
          items:
            $ref: '#/components/schemas/TextCorrection'
          maxItems: 10000
          minItems: 1
          title: Corrections
          type: array
      required:
      - expected_parse_version
      - reason
      - corrections
      title: QualityCorrection
      type: object
  responses:
    BadRequest:
      description: 请求无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证或无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
