  /projects/{projectId}/documents/{documentId}/sections/{sectionId}/revisions/{revision}:
    get:
      operationId: resolveDocumentCitation
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: documentId
        in: path
        required: true
        schema: {type: string}
      - name: sectionId
        in: path
        required: true
        schema: {type: string}
      - name: revision
        in: path
        required: true
        schema: {type: integer, minimum: 0}
      - name: sourceHash
        in: query
        required: true
        schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200':
          description: 经租户和项目授权回查的历史原文片段
          content:
            application/json:
              schema: {type: object}
        '403': {description: 权限不足}
        '404': {description: 引用不可用}
  /review-tasks/pending:
    get:
      operationId: listPendingReviews
      security:
      - bearerAuth: []
      parameters:
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200': {description: 待复核任务}
        '403': {description: 权限不足}
  /review-tasks/{reviewTaskId}/runs/{runId}/findings:
    get:
      operationId: getReviewFindings
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/ReviewTaskId'}
      - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: 当前复核状态和风险项
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewFindings'}
        '403': {description: 权限不足}
        '404': {description: 任务不可用}
  /review-tasks/{reviewTaskId}/runs/{runId}/findings/{findingId}:
    get:
      operationId: getReviewFinding
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/ReviewTaskId'}
      - {$ref: '#/components/parameters/RunId'}
      - name: findingId
        in: path
        required: true
        schema: {type: string}
      responses:
        '200': {description: 风险及独立证据状态}
        '403': {description: 权限不足}
        '404': {description: 风险不可用}
  /review-tasks/{reviewTaskId}/runs/{runId}/findings/{findingId}/decisions:
    post:
      operationId: submitReviewDecision
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/ReviewTaskId'}
      - {$ref: '#/components/parameters/RunId'}
      - name: findingId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}
      responses:
        '200':
          description: 已追加保存的不可变决定
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDecision'}
        '403': {description: 权限不足}
        '409': {description: 任务状态或结果版本冲突}
        '422': {description: 决定或修改字段无效}
  /review-tasks/{reviewTaskId}/runs/{runId}/history:
    get:
      operationId: getReviewHistory
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/ReviewTaskId'}
      - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: 追加式人工复核历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewHistory'}
        '403': {description: 权限不足}
  /review-tasks/{reviewTaskId}/runs/{runId}/publish:
    post:
      operationId: publishReviewResult
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/ReviewTaskId'}
      - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: 幂等发布的不可变结果版本}
        '403': {description: 权限不足}
        '409': {description: 仍有待处理风险或任务状态冲突}
  /review-tasks/{reviewTaskId}/runs/{runId}/resume:
    post:
      operationId: resumeReviewRun
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/ReviewTaskId'}
      - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: 从持久 LangGraph 人工中断继续执行}
        '403': {description: 权限不足}
        '409': {description: 恢复条件或版本冲突}
        '503': {description: 审查 Worker 未连接}
  /review-results/{resultId}/reports/{outputFormat}:
    post:
      operationId: createReviewReport
      security:
      - bearerAuth: []
      parameters:
      - name: resultId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: outputFormat
        in: path
        required: true
        schema: {type: string, enum: [docx, pdf]}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 不可变 Word/PDF 制品元信息
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportMetadata'}
        '403': {description: 权限不足}
        '409': {description: 报告内容或版本冲突}
  /reports/{reportId}/content:
    get:
      operationId: exportReviewReport
      security:
      - bearerAuth: []
      parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 当前授权校验并写入导出审计后的报告文件
          content:
            application/pdf:
              schema: {type: string, format: binary}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: {type: string, format: binary}
        '403': {description: 权限不足}
        '404': {description: 报告不可用}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    ReviewTaskId:
      name: reviewTaskId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 64}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_snapshot_hash, reason]
      properties:
        decision: {type: string, enum: [accept, modify, reject]}
        expected_snapshot_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        reason: {type: string, minLength: 1, maxLength: 2000}
        modified_finding:
          type: [object, 'null']
          properties:
            title: {type: string, minLength: 1, maxLength: 300}
            description: {type: string, minLength: 1, maxLength: 4000}
            severity: {type: string, enum: [low, medium, high, critical]}
            recommendation: {type: string, minLength: 1, maxLength: 4000}
            reasoning_summary: {type: string, minLength: 1, maxLength: 4000}
      allOf:
      - if:
          properties: {decision: {const: modify}}
          required: [decision]
        then:
          properties: {modified_finding: {type: object, minProperties: 1}}
          required: [modified_finding]
        else:
          properties: {modified_finding: {type: 'null'}}
    ReviewFindings:
      type: object
      additionalProperties: false
      required: [review_task_id, run_id, snapshot_hash, status, findings, pending_finding_ids]
      properties:
        review_task_id: {type: string}
        run_id: {type: string, format: uuid}
        snapshot_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {type: string}
        findings: {type: array, items: {type: object}}
        pending_finding_ids: {type: array, items: {type: string}}
    ReviewDecision:
      type: object
      additionalProperties: false
      required: [decision_id, review_task_id, run_id, finding_id, decision, before_state, after_state, reason, reviewer_id, request_id, request_trace_id, decided_at]
      properties:
        decision_id: {type: string, format: uuid}
        review_task_id: {type: string}
        run_id: {type: string, format: uuid}
        finding_id: {type: string}
        decision: {type: string, enum: [accept, modify, reject, confirm_no_findings]}
        before_state: {type: object}
        after_state: {type: object}
        reason: {type: string, minLength: 1, maxLength: 2000}
        reviewer_id: {type: string}
        request_id: {type: string}
        request_trace_id: {type: [string, 'null'], format: uuid}
        decided_at: {type: string, format: date-time}
    ReviewHistory:
      type: object
      additionalProperties: false
      required: [review_task_id, run_id, decisions]
      properties:
        review_task_id: {type: string}
        run_id: {type: string, format: uuid}
        decisions: {type: array, items: {$ref: '#/components/schemas/ReviewDecision'}}
    ReportMetadata:
      type: object
      additionalProperties: false
      required: [report_id, report_content_id, result_id, format, template_version, snapshot_hash, content_hash, created_at]
      properties:
        report_id: {type: string, format: uuid}
        report_content_id: {type: string, format: uuid}
        result_id: {type: string, format: uuid}
        format: {type: string, enum: [docx, pdf]}
        template_version: {type: string}
        snapshot_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        created_at: {type: string, format: date-time}
    ProjectFields:
      type: object
      required:
      - name
      - procurement_type
      - project_type
      - region
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        procurement_type:
          type: string
          enum:
          - government
          - enterprise
          - other
        project_type:
          type: string
          enum:
          - works
          - goods
          - services
        region:
          type: string
          minLength: 1
          maxLength: 200
        industry:
          type:
          - string
          - 'null'
          maxLength: 200
        budget_amount:
          type:
          - number
          - 'null'
          minimum: 0
        applicable_system:
          type:
          - string
          - 'null'
          maxLength: 1000
        procurement_method: &id001
          default: unknown
          enum:
          - tender
          - non_tender
          - unknown
          title: Procurement Method
          type: string
        buyer_type: &id002
          default: unknown
          enum:
          - government_entity
          - enterprise
          - other
          - unknown
          title: Buyer Type
          type: string
        subject_type: &id003
          default: unknown
          enum:
          - works
          - works_related_goods
          - works_related_services
          - goods
          - services
          - unknown
          title: Subject Type
          type: string
        legal_frameworks: &id004
          items:
            enum:
            - tendering
            - government_procurement
            type: string
          maxItems: 2
          title: Legal Frameworks
          type: array
    ProjectCreate:
      allOf:
      - $ref: '#/components/schemas/ProjectFields'
      unevaluatedProperties: false
    Project:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ProjectFields'
      - type: object
        required:
        - project_id
        - tenant_id
        - version
        - created_at
        properties:
          project_id:
            type: string
          tenant_id:
            type: string
          version:
            type: integer
            minimum: 1
          created_at:
            type: string
            format: date-time
    Document:
      additionalProperties: false
      properties:
        document_id:
          title: Document Id
          type: string
        project_id:
          title: Project Id
          type: string
        status:
          enum:
          - quarantined
          - accepted
          - rejected
          - parsing
          - needs_review
          - needs_confirmation
          - ready
          - failed
          title: Status
          type: string
        sha256:
          pattern: ^[a-f0-9]{64}$
          title: Sha256
          type: string
        media_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Media Type
        size_bytes:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Size Bytes
        context_version:
          default: 0
          minimum: 0
          title: Context Version
          type: integer
        parse_version:
          default: 0
          minimum: 0
          title: Parse Version
          type: integer
        issues:
          items:
            enum:
            - TYPE_MISMATCH
            - SIZE_LIMIT
            - MALICIOUS_CONTENT
            - ARCHIVE_LIMIT
            - INVALID_FILE
            - ENCRYPTED_FILE
            - PAGE_LIMIT
            - IMAGE_LIMIT
            - TEXT_LIMIT
            - OCR_LIMIT
            - LOW_QUALITY
            - SCANNER_UNAVAILABLE
            - SCANNER_STALE
            - PARSE_TIMEOUT
            - PARSE_FAILED
            - HASH_MISMATCH
            - ACTOR_FORBIDDEN
            - OUTPUT_LIMIT
            type: string
          maxItems: 20
          title: Issues
          type: array
      required:
      - document_id
      - project_id
      - status
      - sha256
      title: DocumentResponse
      type: object
    ReviewTask:
      type: object
      additionalProperties: false
      required:
      - review_task_id
      - project_id
      - run_id
      - status
      properties:
        review_task_id:
          type: string
        project_id:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_human
          - succeeded
          - failed
          - cancelled
        progress:
          type: number
          minimum: 0
          maximum: 1
    ErrorCode:
      type: string
      enum:
      - INVALID_REQUEST
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - VALIDATION_ERROR
      - RATE_LIMITED
      - INTERNAL_ERROR
      - HTTP_ERROR
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
    Role:
      type: string
      enum:
      - admin
      - reviewer
      - auditor
      - operator
    Login:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      required:
      - tenant_id
      - username
      - password
    AccessToken:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          minimum: 60
          maximum: 3600
      required:
      - access_token
      - token_type
      - expires_in
    Identity:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
      - tenant_id
      - user_id
      - username
      - role
    ProjectUpdate:
      allOf:
      - $ref: '#/components/schemas/ProjectFields'
      - type: object
        required:
        - expected_version
        properties:
          expected_version:
            type: integer
            minimum: 1
      unevaluatedProperties: false
    ProjectList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - items
      - offset
      - limit
    ProjectHistory:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      required:
      - items
    Logout:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - revoked
      required:
      - status
    Fragment:
      additionalProperties: false
      allOf:
      - else:
          properties:
            page:
              minimum: 1
              type: integer
            bbox:
              items:
                minimum: 0
                type: number
              maxItems: 4
              minItems: 4
              type: array
          required:
          - page
          - bbox
        if:
          properties:
            coordinate_system:
              const: ooxml
          required:
          - coordinate_system
        then:
          properties:
            page:
              type: 'null'
            bbox:
              type: 'null'
      - if:
          properties:
            kind:
              const: table_cell
          required:
          - kind
        then:
          properties:
            table:
              minimum: 0
              type: integer
            row:
              minimum: 0
              type: integer
            column:
              minimum: 0
              type: integer
          required:
          - table
          - row
          - column
      properties:
        locator:
          maxLength: 500
          minLength: 1
          title: Locator
          type: string
        page:
          anyOf:
          - maximum: 300
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Page
        bbox:
          anyOf:
          - items:
              type: number
            maxItems: 4
            minItems: 4
            type: array
          - type: 'null'
          default: null
          title: Bbox
        coordinate_system:
          enum:
          - pdf_points
          - image_pixels
          - ooxml
          title: Coordinate System
          type: string
        kind:
          enum:
          - paragraph
          - table_cell
          - ocr
          title: Kind
          type: string
        section:
          default: ''
          maxLength: 300
          title: Section
          type: string
        text:
          maxLength: 8000
          title: Text
          type: string
        text_sha256:
          pattern: ^[a-f0-9]{64}$
          title: Text Sha256
          type: string
        source:
          enum:
          - native
          - ocr
          - manual
          title: Source
          type: string
        confidence:
          anyOf:
          - maximum: 1
            minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Confidence
        table:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Table
        row:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Row
        column:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Column
      required:
      - locator
      - coordinate_system
      - kind
      - text
      - text_sha256
      - source
      title: Fragment
      type: object
    SectionResponse:
      additionalProperties: false
      properties:
        section_id:
          title: Section Id
          type: string
        source_hash:
          pattern: ^[a-f0-9]{64}$
          title: Source Hash
          type: string
        automatic:
          $ref: '#/components/schemas/Fragment'
        effective:
          $ref: '#/components/schemas/Fragment'
        revision:
          minimum: 1
          title: Revision
          type: integer
      required:
      - section_id
      - source_hash
      - automatic
      - effective
      - revision
      title: SectionResponse
      type: object
    DocumentSections:
      additionalProperties: false
      properties:
        document_id:
          title: Document Id
          type: string
        parse_version:
          minimum: 1
          title: Parse Version
          type: integer
        items:
          items:
            $ref: '#/components/schemas/SectionResponse'
          title: Items
          type: array
      required:
      - document_id
      - parse_version
      - items
      title: SectionsResponse
      type: object
    ContextCandidate:
      additionalProperties: false
      properties:
        field:
          enum:
          - procurement_type
          - project_type
          - region
          - name
          - industry
          - budget_amount
          - applicable_system
          title: Field
          type: string
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        confidence:
          maximum: 1
          minimum: 0
          title: Confidence
          type: number
        section_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Section Id
      required:
      - field
      - value
      - confidence
      title: ContextCandidate
      type: object
    DocumentContext:
      additionalProperties: false
      properties:
        document_id:
          title: Document Id
          type: string
        version:
          minimum: 1
          title: Version
          type: integer
        candidates:
          items:
            $ref: '#/components/schemas/ContextCandidate'
          title: Candidates
          type: array
        manual:
          anyOf:
          - $ref: '#/components/schemas/ContextFields'
          - type: 'null'
          default: null
        confirmed:
          title: Confirmed
          type: boolean
        reason:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Reason
      required:
      - document_id
      - version
      - candidates
      - confirmed
      title: DocumentContext
      type: object
    ContextFields:
      additionalProperties: false
      properties:
        name:
          maxLength: 300
          minLength: 1
          title: Name
          type: string
        procurement_type:
          enum:
          - government
          - enterprise
          - other
          title: Procurement Type
          type: string
        project_type:
          enum:
          - works
          - goods
          - services
          title: Project Type
          type: string
        region:
          maxLength: 200
          minLength: 1
          title: Region
          type: string
        industry:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Industry
        budget_amount:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Budget Amount
        applicable_system:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          default: null
