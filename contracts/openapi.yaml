openapi: 3.1.0
info:
  title: 招标文件智能合规审查 API
  version: 0.2.0
  description: v1alpha2 开发契约；所有业务接口要求租户范围和审计关联 ID。
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, version]
                properties:
                  status: {type: string, enum: [ok]}
                  version: {type: string}
  /projects:
    post:
      operationId: createProject
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectCreate"}
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /projects/{projectId}/documents:
    post:
      operationId: uploadDocument
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "202":
          description: 文件进入安全检查
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Document"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /projects/{projectId}/reviews:
    post:
      operationId: createReview
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [document_ids]
              properties:
                document_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string}
      responses:
        "202":
          description: 审查任务已排队
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewTask"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /reviews/{reviewTaskId}:
    get:
      operationId: getReview
      security: [{bearerAuth: []}]
      parameters:
        - name: reviewTaskId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 审查状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewTask"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
  schemas:
    ProjectFields:
      type: object
      required: [name, procurement_type, project_type, region]
      properties:
        name: {type: string, minLength: 1, maxLength: 300}
        procurement_type: {type: string, enum: [government, enterprise, other]}
        project_type: {type: string, enum: [works, goods, services]}
        region: {type: string, minLength: 1, maxLength: 200}
        industry: {type: [string, "null"], maxLength: 200}
        budget_amount: {type: [number, "null"], minimum: 0}
    ProjectCreate:
      allOf:
        - $ref: "#/components/schemas/ProjectFields"
      unevaluatedProperties: false
    Project:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ProjectFields"
        - type: object
          required: [project_id, tenant_id, version, created_at]
          properties:
            project_id: {type: string}
            tenant_id: {type: string}
            version: {type: integer, minimum: 1}
            created_at: {type: string, format: date-time}
    Document:
      type: object
      additionalProperties: false
      required: [document_id, project_id, status, sha256]
      properties:
        document_id: {type: string}
        project_id: {type: string}
        status: {type: string, enum: [quarantined, accepted, rejected, parsing, ready, failed]}
        sha256: {type: string, pattern: "^[a-fA-F0-9]{64}$"}
    ReviewTask:
      type: object
      additionalProperties: false
      required: [review_task_id, project_id, run_id, status]
      properties:
        review_task_id: {type: string}
        project_id: {type: string}
        run_id: {type: string}
        status: {type: string, enum: [queued, running, waiting_human, succeeded, failed, cancelled]}
        progress: {type: number, minimum: 0, maximum: 1}
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_ERROR
        - RATE_LIMITED
        - INTERNAL_ERROR
        - HTTP_ERROR
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}
  responses:
    BadRequest:
      description: 请求无效
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: 未认证或无权限
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: 资源不存在或不可见
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

