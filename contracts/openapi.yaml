components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    ReviewTaskId:
      name: reviewTaskId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 64}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    ConfigurationCatalog:
      properties:
        skills:
          items:
            $ref: '#/components/schemas/SkillCatalogItem'
          type: array
          title: Skills
        model_policy:
          $ref: '#/components/schemas/ModelPolicySnapshot'
        model_configuration_boundary:
          type: string
          title: Model Configuration Boundary
      additionalProperties: false
      type: object
      required:
      - skills
      - model_policy
      - model_configuration_boundary
      title: ConfigurationCatalog
