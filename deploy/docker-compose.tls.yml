# Public-exposure overlay. Without it nginx stays on loopback and nothing is reachable
# from the network.
#
#   ACME bootstrap (before any certificate exists) — serves only the challenge path:
#     NGINX_CONF=nginx-acme.conf docker compose -f docker-compose.demo.yml \
#       -f deploy/docker-compose.tls.yml up -d nginx
#
#   HTTPS service (after the certificate is deployed):
#     NGINX_CONF=nginx-demo-tls.conf docker compose -f docker-compose.demo.yml \
#       -f deploy/docker-compose.tls.yml up -d nginx
#
# TLS_CERT_DIR holds REAL files, never certbot's live/ symlinks: those point into
# /etc/letsencrypt/archive and would dangle inside the container.
services:
  nginx:
    volumes:
      - ./deploy/${NGINX_CONF:-nginx-acme.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/tls:ro
    # `!override` replaces the base list instead of appending to it, so the loopback-only
    # mapping cannot survive into a public deployment.
    ports: !override
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
