# Bootstrap phase: HTTP only, used exclusively so Let's Encrypt can validate ownership of
# the public IP over http-01.
#
# This configuration deliberately serves NOTHING except the ACME challenge path. While it
# is active the login page, the API and the static workbench are all unreachable over plain
# HTTP, so opening port 80 to the internet never exposes a credential prompt.
#
# Replace it with deploy/nginx-demo-tls.conf once a certificate exists.
server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;

    # Certbot writes one file per challenge here; nothing else is served.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/acme;
        try_files $uri =404;
    }

    # Everything else: no application, no redirect target that does not exist yet.
    location / {
        return 503;
    }

    location = /healthz {
        default_type "text/plain";
        return 200 "acme-bootstrap\n";
    }
}
