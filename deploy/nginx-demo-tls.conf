# HTTPS entry point. Use together with deploy/docker-compose.tls.yml, which mounts the
# certificates under /etc/nginx/tls and publishes 443.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Never serve credentials over plain HTTP.
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # Required for HSTS to be meaningful; only enable once the certificate is permanent.
    # add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 12m;
    client_body_timeout 60s;

    include /etc/nginx/includes/locations.inc;
}
