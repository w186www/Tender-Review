# HTTPS entry point. Use together with deploy/docker-compose.tls.yml, which mounts the
# certificate directory under /etc/nginx/tls and publishes 80 and 443.
#
# Port 80 serves exactly two things: the ACME challenge path, so renewal keeps working for
# the lifetime of the deployment, and a redirect to HTTPS. It never serves the workbench,
# the API or a login form in clear text.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    # The challenge location must NOT be redirected: Let's Encrypt fetches
    # http://<ip>/.well-known/acme-challenge/<token> and a redirect to an HTTPS endpoint
    # that is being replaced is an avoidable failure mode. `^~` beats the prefix location
    # below, and a server-level `return` would run before location matching and break this.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Login throttling zone. Declared here because limit_req_zone is only valid in the
# http context, and this file is included from there.
limit_req_zone $binary_remote_addr zone=loginzone:10m rate=12r/m;
limit_req_status 429;

server {
    # default_server matters for IP access: no SNI is sent when a client connects to a bare
    # IP address, so this block has to be the fallback certificate.
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # Short-lived certificates are re-issued every few days; keep sessions short so a
    # client cannot pin a session across a certificate change.
    ssl_session_tickets off;
    # Required for HSTS to be meaningful; only enable once the certificate proves stable.
    # add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 12m;
    client_body_timeout 60s;

    include /etc/nginx/includes/locations.inc;
}
