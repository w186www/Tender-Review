# Plain HTTP entry point, used for local verification and for deployments that terminate
# TLS on a cloud load balancer in front of this host.
# Login throttling zone. Declared here because limit_req_zone is only valid in the
# http context, and this file is included from there.
limit_req_zone $binary_remote_addr zone=loginzone:10m rate=12r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    server_tokens off;

    # config/ingestion.yaml allows 10 MiB uploads plus multipart framing; leave the
    # application's own 413 in charge for anything close to the limit.
    client_max_body_size 12m;
    client_body_timeout 60s;

    include /etc/nginx/includes/locations.inc;
}
