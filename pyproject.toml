[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bidding-compliance-agent"
version = "0.1.0"
description = "Production-oriented bidding document compliance review agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.35,<2",
  "pdfplumber>=0.11,<0.12",
  "pypdf>=6,<7",
  "pypdfium2>=4.30,<6",
  "Pillow>=11,<13",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.25,<2",
  "editables>=0.5,<1",
  "jsonschema>=4.23,<5",
  "referencing>=0.37,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "PyYAML>=6.0,<7",
  "openapi-spec-validator>=0.7,<1",
  "httpx>=0.28,<1",
  "reportlab>=4,<5",
  "python-docx>=1.2,<2",
  "types-PyYAML>=6,<7",
  "types-defusedxml>=0.7,<1",
  "boto3-stubs[s3]>=1.35,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bidding_compliance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bidding_compliance"]

