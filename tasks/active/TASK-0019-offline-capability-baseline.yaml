  "steps": [
    "基于仓库真实 M3 任务、集成记录和远端 CI 逐项核验退出条件，修正状态叙述；保留 TASK-0012/0013/0014 原验收条件。",
    "固定已有五个合成黄金案例的文件 SHA-256、版本、来源及逐样本标注状态；检查真实样本文件仅核对路径和授权记录，缺失或未授权时标记待补，不读取、猜测、下载或外发。",
    "按既有安全解析流程评估可用合成 DOCX/PDF 与 OCR 样本的抽取、定位、数字、表格、重复条款及质量警报；保留格式、扫描/文本类型及有效分母。",
    "运行五类确定性 Skill 发现，记录规则、来源定位、重复候选、专家确认样本覆盖与未匹配项；没有专家金标的样本只报告候选覆盖。",
    "使用正式 CharacterEmbedding/BM25/RRF 路径评估检索，并逐条说明地区/主体/采购制度/方式适用性、效力区间、版本核验日期及不能确认的法律结论。",
    "核验原文证据、定位、法规来源和 Evidence Checker 状态降级；不修改 Checker 或现有阈值来提高通过率。",
    "通过现有授权离线 ReviewEngine 测试通道实际执行 LangGraph、数据库、证据门禁、人工复核、报告、Checkpoint 恢复和失败路径，明确标注离线确定性替身不代表真实 LLM 语义质量。",
    "将失败按九个既定层次记录最小复现、预期/实际、节点、稳定性、合规影响、P0/P1/P2 和最小修复建议，并给出能力边界和投入真实模型的建议。",
    "执行正式 Focused、Full 与所需解析、PostgreSQL/ReviewEngine 专项；发布可重复命令、结果工件和仓库状态记录。"
  ],
