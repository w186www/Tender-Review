  "steps": [
    "记录正常服务入口、现有测试宿主和前端流程的差距；区分真实服务、离线替身、仅有测试证据及尚未配置的能力。",
    "在严格 OCRRuntimeIdentity 持久化 JSON 读取边界仅规范化 JSON 数组与 Python tuple 表示；保持字段、内容、身份及原 provenance 哈希校验严格，新增限定测试，不改其他生产审查逻辑。",
    "使用 TASK-0011 已有隔离服务和正式安全解析/ReviewEngine 能力，提供 loopback-only 的离线演示启动入口；仅为合成数据启动临时PostgreSQL、MinIO、ClamAV和解析容器，使用随机临时凭据并在停止时清理。",
    "让现有持久化 ingestion_job 队列在隔离演示环境有界消费；调用既有 process_document.py worker，不将解析、鉴权或审查逻辑搬入前端。",
    "仅显式装配 OfflineReviewGateway；页面和演示材料须清楚显示 deterministic/offline、没有真实LLM语义推理；不得通过普通 API 默认启动路径启用模型。",
    "提供稳定、可重建且显著标明为合成的 DOCX 演示输入，实际完成创建项目、上传、扫描解析、Skill/RAG、证据检查、人工复核/恢复、结果发布和 Word/PDF 下载。",
    "保持未核验法规的证据降级；检查没有可核实法规依据时的演示说明。真实供应商接入与公网/远程部署只形成 DEC-002/DEC-001 待批准事项，不执行调用、部署或产生费用。",
    "执行当前源码候选的 Microsoft Edge 真实浏览器端到端、正式 Focused、Full、PostgreSQL、ingestion 与 Quick/远端CI适用门禁，并将日志、测试统计和源码 SHA 绑定。"
  ],
