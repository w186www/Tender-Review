    "仅修复隔离演示运行角色对 document_section.revision 缺少的列级 UPDATE 权限；保留租户 RLS、原文不可变触发器及 NO SUPERUSER/NOBYPASSRLS。经正式 corrections API 验证同租户审查员可校正、异租户仍不能读取或校正；禁止管理员 SQL 直接修改业务数据。",
    "按正式上传 API、格式/签名校验、ClamAV、固定解析镜像隔离、切片、质量门禁和人工上下文确认流程处理用户当前指定的单个本地文件；本轮 PDF 取代先前 DOCX 作为当前样本。原文件和敏感输出仅留本地私有目录；任何安全或解析门禁失败即停止下游审查。",
    "安全解析通过后冻结当前文件的原文定位、SHA-256、解析质量及五类确定性 Skill 和 CharacterEmbedding/BM25/RRF 法规检索结果；不修改规则、Prompt、RAG、阈值、Evidence Checker 或法规数据。",
    "只可使用与当前样本对应且独立确认的专家标签；不得把此前天津学校样本的 R-01 至 R-07 参考问题或答案移用于当前文件。无样本特定金标时只报告候选与证据，不统计准确率或召回率。",
    "法律版本、适用性和核验状态使用本地证据核对；模型替身输出不得计为真实语义效果，未核验法规不得作为确定违法依据。",
    "准备 DEC-005 真实文件 Qwen 评测授权提案。DEC-002 已消耗；在用户明确批准 DEC-005 且任务安全门禁通过前，不得对百炼或任何外部模型/Embedding 服务发送本文件内容。",
