    "输出本地受保护的真实文件诊断报告和一份不含原文/敏感摘录的仓库摘要；对于真实允许的零候选输入，离线 Gateway 返回既有 Schema 定义的空 findings，不伪造风险或法规；其余候选与证据校验保持严格；本任务不自动提交、推送或开发不在本契约范围内的业务功能。",
