  "steps": [
    "只读核查 CONTEXT_INVALID 根因：检索查询构造、适用性排除、法规核验状态与 Evidence Checker 状态。",
    "实现两级法律适用判断：项目级框架确认保持不变，风险级允许在框架未确认时检索可能相关依据，但任何命中都不得标记为已核验适用。",
    "对候选法规输出四级适用状态（applicable_verified／potentially_relevant／applicability_unknown／not_applicable），复用现有契约字段风格。",
    "以天津地铁三个真实风险（逾期违约金、集团黑名单资格条件、报价得分不明确）完成离线检索与证据核验验收，不硬编码期望法规。",
    "如实报告未完成能力（LLM 法规关联分析、报告端到端）与预算边界，不伪造历史证据。"
  ],
