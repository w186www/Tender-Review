  "handoff_notes": "根因：RetrievalQuery.consistent_context 对企业非招标推导出空框架并抛 CONTEXT_INVALID，检索在构造查询阶段即终止（连 BM25 都不执行）；同时 applicability_exclusions 把空框架当作 framework_mismatch，clause_exclusions 也会排除，导致即使放行查询也无候选。修复：空框架视为『未知』而非『不匹配』——不推断框架、仍可检索参考候选，但 confirmation_reason 在无可确认框架时拒绝返回 valid。四案例离线验收见 docs/development/TASK-0024-validation.md。未完成：LLM 法规关联分析（需新增预算授权）、报告页面端到端（需真实运行）。既有环境限制：tests/test_verification_modes.py 的 Quick 测试在本机因 PowerShell 输出编码失败，与本次变更无关（移除变更后仍失败）。"
