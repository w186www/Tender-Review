  "handoff_notes": "源码审查定位三类问题：(1) merge_findings 把 verify_legal_hit 通过的法规全部计入 verified_laws，而该函数只证明引用真实性（存在性、发布绑定、检索一致），不证明法律有效性与适用性，导致 unverified 法规进入 finding evidence 且被排除出 legal_references；现改为只有 eligible_for_confirmation 的法规进入正式证据，其余转入 legal_references。(2) 预算账本为单文件 SQLite，删除即恢复额度；新增 verify_ledger_continuity 在存在审计记录而账本缺失/为空/不可读时失败关闭，但无法检测两文件协同回滚，该能力列为部署阻断。(3) baseline 作业 10 分钟超时改为 20 分钟。"
