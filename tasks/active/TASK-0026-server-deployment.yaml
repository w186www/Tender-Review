  "steps": [
    "核查现有运行时装配链路，确定容器化部署的最小改动面，不重写 Agent、不重做数据库。",
    "编写 docker-compose.demo.yml：PostgreSQL 16、MinIO、ClamAV、API、Ingestion Worker、Nginx 反向代理，全部使用显式命名卷或宿主机持久化目录。",
    "编写 deploy/Dockerfile.api 复用 requirements-dev.lock 与项目源码，保持版本锁定。",
    "编写 deploy/nginx.conf，托管 React 静态产物并正确反代实际 API 路径，保持鉴权头与上传体积限制。",
    "编写 deploy/demo.env.example、初始化与健康检查脚本、备份与恢复脚本、部署说明。",
    "在本机 Docker Linux 引擎上实际拉起全部服务，逐项验证健康、登录、上传、扫描、解析、审查、复核、报告下载。",
    "验证数据持久化：重启与容器重建后项目、文件、审查任务与报告仍然存在，并完成一次备份/恢复演练。",
    "给出阿里云 ECS 部署步骤、资源规格建议、所需服务器信息清单与未解决阻断，写入验证文档。",
    "运行仓库验证与提交，观察远程 CI。"
  ],
