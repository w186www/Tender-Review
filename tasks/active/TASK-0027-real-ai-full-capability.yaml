  "handoff_notes": "DEC-007 全能力实施的代码与离线测试任务。首次真实调用需在离线测试与 CI 完成后单独提交申请并等待批准；批准前不得产生任何付费调用。线上仍运行 TASK-0026 的离线确定性模式。\n\n【ScopedEmbeddingGuard 线性化的设计结论，实现前必须按此进行】\n现状：approve(texts) 对整批 payload 取摘要存入 allowed_hashes；reserve_external 只做摘要成员校验。工厂原本为 10 条预批准其全部子集（1023 个摘要）以兼容断点续建时批次构成可变。\n\n冲突：provider 调 reserve_external 时只传 request_hash，看不到文本，因此 guard 无法按条校验。若把 3120 条照搬旧办法枚举子集，摘要数约 312 批 × 1023 ≈ 32 万，不可接受。\n\n采用的方案（二选一，倾向前者，实现时择一并写测试）：\n  A. 让 build() 以「整片发送」代替「只发缺失子集」：批的构成只由 clause_ids 的顺序与批大小决定，因此摘要确定且只有 ceil(N/10) ≈ 312 个；已缓存整片的批直接跳过。代价是某一整片部分命中时会重发少量已缓存条目（费用可忽略，因为总量不足 1 元）。guard 侧只需把「枚举子集」换成「按当前 clause_ids 依序切片并逐片 approve」，保持逐摘要校验语义不变。\n  B. 若不想改 build() 的发送粒度，则在 guard 上增加按条目的批准集合，并让 provider 在 reserve 前把本批文本交给 guard 校验成员资格；这需要改动 legal/embedding_provider.py 的调用签名，改动面更大。\n\n两种方案都不得退化为「批准任意文本」——按条或按片校验必须保留，否则等于删除外发门禁。实现后必须有不通过批准即 PermissionError 的反例测试。\n\n【2026-10-16 验收前阻断问题处置（9 项）】\n1) compose：新增 x-real-model-environment 锚点，仅合并进 api.environment（worker/init 不注入）；全部值为 ${VAR:-} 可选，留空即离线启动。测试 tests/test_task0027_deploy_compose.py 解析 YAML 固定该边界。\n2) 预构建索引：real_embedding_runtime 新增 require_prebuilt_vector_index；AuthorizedRetrieverFactory.allow_build 默认 False（API 装配显式传 False），维护命令 scripts/prebuild_legal_vectors.py 直接调用 build_authorized_vector_index 继续支持建库与断点续建。缺索引/未完成/校验失败 → 拒绝且零供应商调用。\n3) 身份一致性：planned_build_id 绑定 embedding 身份+发布版本+条款覆盖；API 侧再校验 manifest 的 identity/publication/revision/coverage；测试覆盖身份、发布版本、卷与账本 scope 不一致各自被拒。\n4) 撤销即时生效：FileAuthorizationRegistry 按文件 mtime/size 重读（线程锁保护），RealRuntimeAuthorization 暴露 allowed_document_source 可调用视图，_freeze_run/_invoke 与 AuthorizedTenderMinimizer 每次判定重解析；测试用「进程已启动 → 外部 revoke → 再次外发被拒」证明（含 gateway 级反例）。\n5) 前端：新增 dec007-real-qwen 模式文案（授权范围与逐文件白名单），保留既有模式；Dockerfile.web 与 demo.env.example 注释同步。\n6) 上限：Embedding 400 → 800；边界测试 800 允许 / 801 拒绝、¥30 耗尽即拒绝（批次有余量）、失败与未知用量保留预留且不自动补发。\n7) 文档：docs/development/TASK-0027-validation.md（本轮命令与结果）、DEC-007 修订、deploy/README-demo.md 逐文件授权运维步骤、PROJECT_STATE.md、CHANGELOG.md。\n\n仍未完成：git 提交与远程 CI 观察（用户自行提交）；线上部署与首次付费调用（需单独批准）。"
