- 账本基线只读核对：`scripts/task0027_ledger_baseline.py`（`mode=ro`，不创建/不修改/不重置），期望 0/312/¥0.1035070/未结算 0，不一致退出码 2 并要求停止上报。
- 方案 A 的边界（用户明确要求如实记录）：账本只存计数、上限是进程内参数，宽上限实例理论上仍可打开同一账本；本轮必须确保只有一个真实模型验证实例运行，不得宣称跨任意进程的全局收紧锁。
