  "handoff_notes": "2026-10-18 用户以 DEC-008 批准 D1 首版支持范围、D2 工程侧核验/标签准备、D3 既有百炼供应商受控真实调用（累计 200 元/2000 次/2000 批，不新增额度）和 D4 现有 ECS 备份/隔离演练/候选发布；D2 的逐条内容确认、专家金标和用户独立验收仍未完成。U06 已实现结构质量信号、容量前检、已 ready 文档校正后的上下文失效和合成 OCR 已知失败回归；D1 范围的 PDF/DOCX/PNG/JPEG、10 MiB、300 页、OCR 30 页边界由 tests/test_task0029_support_scope.py 覆盖；正式 U06 仍为 planned，因为 U03 冻结样本和 D2 专业标签未完成，TASK0029-002 evidence 保持为空。U07 已强化无人工 rule-law binding 时不以模型文本形成违法结论；来源核验和 binding 签署仍受 D2 限制，U07 保持 in_progress。U08 已有饱和标记、覆盖摘要、有界 section 二分/重扫、深度和额外批次上限、父子覆盖与缓存复用；真实覆盖质量等待受控真实评测和冻结集，TASK0029-004 evidence 保持为空。U10 已把法规候选与受限 evidence_id 真实送入语义请求（新 Prompt task0030-semantic-rag-v1，保留 legacy task0023-semantic-v1 以恢复历史在途运行），服务端继续用 verify_legal_hit 重核引用/版本/资格；零候选不调用模型；新增 product_execution 覆盖/部分完成/ unknown 调用投影（报告 task0010-report.v3、findings API 可选字段、网页提示），并把 selected_by_model 标记写入参考条款。真实服务器端到端、法规引用可见性和报告下载仍待 U11/U12/D3/D4 验收，TASK0029-006/008 evidence 暂保持为空。U03 已获准恢复：评测器/测试/两份历史结果从备份恢复，原始哈希一致；评测器仅格式适配（7b2c…→2888…）；缺失法规报告重新生成到新路径，核心指标一致；五案例身份/分区/待裁定标签材料已登记；专家标签仍为 0，precision/recall 未测量。DEC-002 与 DEC-007 历史授权不可复用或扩展；本轮 D3 只按 DEC-008 的允许数据和累计额度执行。用户独立验收不由本任务状态替代。"
