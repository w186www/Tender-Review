  "handoff_notes": "D1—D3 分别限制支持范围/容量承诺、专业法规与业务标签签署、真实模型和数据外发；只有相关验收活动暂停。U07 已强化无人工 rule-law binding 时不以模型文本形成违法结论；来源核验和 binding 签署仍受 D2 限制，U07 保持 in_progress。当前代码候选官方 Full 七阶段全部通过（后端 843 passed、2 项既有弃用 warning；HTTP 启动及鉴权项目生命周期通过），但这不构成 U07 的 D2 内容验收。D2 不批准实际法规材料或内容核验。U03 的冻结评测器/测试/结果来源仍缺失；只读核对的唯一已知备份 bundle 未包含 TASK-0019 来源，未解包或导入。DEC-002 与 DEC-007 历史授权不可复用或扩展。用户独立验收不由本任务状态替代。"
