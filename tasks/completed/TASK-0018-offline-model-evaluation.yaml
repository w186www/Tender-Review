  "steps": [
    "Freeze and reproduce the existing 43-version/3120-fragment CharacterEmbedding/BM25/RRF baseline; keep law recall, applicability/validity filtering, unverified references and expert-unconfirmed candidates separate.",
    "Add a provider-neutral dense Embedding interface and Bailian adapter; verify documented model/region/dimension/batch/schema/error contracts with synthetic inputs through MockTransport only. The real provider is disabled and no vendor request is permitted.",
    "Add local SQLite exact-vector persistence, content-addressed build manifests and batch checkpoints bound to provider/model/region/dimensions/parameters/legal publication/revision; verify idempotence, resume and identity isolation using synthetic vectors excluded from quality metrics.",
    "Measure synthetic scanned PDFs with the real existing restricted Tesseract parser for CER, critical numbers/amounts, page/locator consistency, table completeness, latency, memory and quality/failure/timeout handling; do not install PaddleOCR or relax security gates.",
    "Freeze run-level OCR, embedding, index, retrieval, reranker, prompt and model-config identities; distinguish this snapshot from per-call audit, which remains future scope.",
    "Run Focused, final Full and the required PostgreSQL/RLS/checkpoint/report/security checks; publish actual evidence and clearly separate complete, blocked and unmeasured work."
  ],
